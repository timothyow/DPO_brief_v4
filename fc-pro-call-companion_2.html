<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FC Professional · Call Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F4EC; --card:#FFFFFF; --ink:#152740; --ink-soft:#5A6B82;
    --line:#E6E0D2; --blue:#1F4FD8; --blue-soft:#EBF0FD;
    --amber:#B4690E; --amber-soft:#FBF1E2;
    --green:#1E7F4F; --green-soft:#E7F4EC; --red:#B3362B;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    display:flex;justify-content:center;min-height:100vh}
  #frame{width:100%;max-width:480px;display:flex;flex-direction:column;min-height:100vh}
  header{padding:18px 20px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .wordmark{font-family:'Sora',sans-serif;font-weight:700;font-size:17px;letter-spacing:-0.01em}
  .wordmark span{color:var(--blue)}
  h1{font-family:'Sora',sans-serif;font-weight:700;letter-spacing:-0.02em;margin:0}
  .label{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .chip{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;border-radius:999px;padding:4px 10px}
  .chip.neutral{color:var(--ink-soft);background:#EFEBE0}
  .chip.blue{color:var(--blue);background:var(--blue-soft)}
  .chip.amber{color:var(--amber);background:var(--amber-soft)}
  .btn{width:100%;border:none;border-radius:12px;padding:14px 16px;font-size:15px;font-weight:600;
    font-family:inherit;cursor:pointer;background:var(--ink);color:#fff}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.tone-blue{background:var(--blue)} .btn.tone-amber{background:var(--amber)}
  select,textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:10px;
    padding:12px;font-size:14px;font-family:inherit;color:var(--ink);background:#fff}
  textarea{min-height:90px;resize:vertical}
  button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{
    outline:2px solid var(--blue);outline-offset:2px}
  .stack{display:flex;flex-direction:column;gap:12px;padding:0 20px 32px}
  .backlink{border:none;background:none;color:var(--ink-soft);font-size:13px;cursor:pointer;padding:0;font-family:inherit}
  .rail{display:flex;gap:6px;padding:0 20px 14px}
  .rail button{flex:1;border:none;background:transparent;cursor:pointer;padding:0;font-family:inherit;text-align:left}
  .rail .bar{height:5px;border-radius:999px;background:var(--line);transition:background .2s}
  .rail .name{margin-top:7px;font-size:12px;font-weight:500;color:var(--ink-soft)}
  .rail button[data-active="1"] .name{font-weight:700;color:var(--ink)}
  .outlet-card{width:100%;text-align:left;cursor:pointer;font-family:inherit;display:block}
  .checkrow{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;
    padding:7px 8px;border-radius:8px;cursor:pointer}
  .checkrow.done{background:var(--green-soft)} .checkrow.done span{color:var(--ink-soft)}
  .checkrow input{margin-top:3px;accent-color:var(--green)}
  .quote{font-size:14px;line-height:1.5;font-style:italic;border-radius:10px;padding:9px 12px}
  .quote.blue{background:var(--blue-soft)} .quote.amber{background:var(--amber-soft)}
  .pill{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;
    padding:8px 14px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer}
  .pill[data-on="1"].blue{border-color:var(--blue);background:var(--blue-soft)}
  .pill[data-on="1"].amber{border-color:var(--amber);background:var(--amber-soft)}
  .pill:disabled{opacity:.55;cursor:not-allowed;color:var(--ink-soft)}
  .row{display:flex;gap:6px;flex-wrap:wrap}
  .muted{font-size:13px;color:var(--ink-soft)}
  .small{font-size:12px;color:var(--ink-soft)}
  .bullet{display:flex;gap:8px;margin-bottom:5px;font-size:14px;line-height:1.5}
  .bullet b{font-weight:700}
  .notice{font-size:12.5px;color:var(--amber);background:var(--amber-soft);border-radius:10px;padding:9px 12px;line-height:1.45}
</style>
</head>
<body>

  <header>
    <div class="wordmark">FC Professional <span>· Call Companion</span></div>

/* ---------------- OBJECTION LIBRARY (approved responses) -------------
   Source of truth for objection handling. The AI may rephrase these for
   a specific account but must never go beyond them (no invented pricing,
   discounts, claims or commitments). Extend per reason code as the
   guideline grows. --------------------------------------------------- */
const OBJECTION_LIBRARY = {
  crosssell: [
    { id:"price", label:"Price too high",
      approved:"Focus on cost per portion, not price per litre. Debic Whipping Cream 35% has a high overrun, so one litre whips into more finished volume than most alternatives — cost per cake or portion is often lower. Offer a side-by-side trial to prove the yield. Do not offer discounts on the spot; log pricing feedback instead." },

    { id:"performance", label:"Doubts on performance",
      approved:"Lead with the two proof points: excellent stability (holds shape in display, longer working window) and rich dairy taste customers notice. The strongest answer is a demo — offer to arrange one rather than debating on the spot." },

/* ---------------- DATA SERVICE (swap point) -------------------------- */
const wait = ms => new Promise(r => setTimeout(r, ms));
const dataService = {
  async getCallPlan(){ await wait(250); return MOCK_DB.outlets; },            // → GET /api/callplan
  async getOutlet(id){ await wait(120); return MOCK_DB.outlets.find(o=>o.id===id); }, // → GET /api/outlets/{id}
  async saveVisit(rec){                                                        // → POST /api/visits
    await wait(300);
    MOCK_DB.visits.push(rec);
    const o = MOCK_DB.outlets.find(x=>x.id===rec.outletId);
    if(o){
      o.history = [{date:rec.date,type:"visit",
        summary:`${rec.status}${rec.outcome?" — "+rec.outcome:""}${rec.notes?". "+rec.notes:""}`}, ...o.history];
      o.lastVisitStatus = rec.status;
    }
    return {ok:true};
  }
};

async function generateBrief(outlet, pb){
  const app = pb.applications ? pb.applications.find(a=>a.id===outlet.application) : null;
  const prompt = `You are a sales coach for FrieslandCampina Professional (Dutch Lady and Debic foodservice products) preparing a field rep for a customer visit in Malaysia.

OUTLET:
${JSON.stringify({name:outlet.name,channel:outlet.channel,area:outlet.area,contact:outlet.contact,profile:outlet.profile},null,2)}

PURCHASE & VISIT HISTORY (newest first):
${outlet.history.map(h=>`- ${h.date} [${h.type}] ${h.summary}`).join("\n")}

CALL TYPE: ${pb.label}
RECOMMENDED ACTIONS: ${pb.actions.join("; ")}
DISCOVERY CHECKLIST: ${pb.checks.join(" | ")}
${pb.pitchLines ? "SUGGESTED CONVERSATION LINES: " + pb.pitchLines.join(" | ") : ""}
${app && app.pitch ? "PITCH (application: " + app.label + "): " + JSON.stringify(app.pitch) : ""}

Write a personalized pre-call brief for THIS outlet. Ground every point in the history and profile above — be specific, not generic. Keep language simple and rep-friendly.

Respond ONLY with valid JSON, no markdown fences, no preamble:
{
  "objective": "one sentence — what winning this visit looks like",
  "situation": "2-3 sentences summarizing where this account stands and why",
  "openingLine": "a natural first thing to say to the contact, referencing something real",
  "keyQuestions": ["4-5 questions adapted from the checklist to this outlet's situation"],
  "pitchAngle": "1-2 sentences — the strongest angle for this specific outlet",
  "watchouts": ["2-3 risks or sensitivities to handle carefully"],
  "suggestedGoal": "the concrete commitment to ask for before leaving"
}`;

  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:1000,
      messages:[{role:"user",content:prompt}] })
  });
  if(!res.ok) throw new Error("API " + res.status);
  const data = await res.json();
  const text = data.content.filter(b=>b.type==="text").map(b=>b.text).join("\n");
  return JSON.parse(text.replace(/```json|```/g,"").trim());
}

/* ---------------- AI: TAILOR OBJECTION REPLY ------------------------- */
async function tailorObjection(outlet, pb, obj){
  const prompt = `You are a sales coach for FrieslandCampina Professional (Dutch Lady and Debic) in Malaysia. A rep is mid-visit at this account and the customer just raised the objection: "${obj.label}".

ACCOUNT: ${JSON.stringify({name:outlet.name,channel:outlet.channel,profile:outlet.profile,contact:outlet.contact})}
RECENT HISTORY: ${outlet.history.slice(0,3).map(h=>`${h.date} [${h.type}] ${h.summary}`).join(" | ")}

APPROVED RESPONSE GUIDANCE (single source of truth):
${obj.approved}

Rewrite the approved guidance as a short, natural spoken reply the rep can say to THIS customer, referencing their specific situation where it strengthens the reply.
Rules: stay strictly within the approved guidance — do NOT invent prices, discounts, product claims or commitments that are not in it. Maximum 80 words. Respond with the spoken reply only — no preamble, no quotation marks.`;
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:1000,
      messages:[{role:"user",content:prompt}] })
  });
  if(!res.ok) throw new Error("API " + res.status);
  const data = await res.json();
  return data.content.filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
}

/* ---------------- TINY STATE + RENDER -------------------------------- */
const app = document.getElementById("app");
const state = {
  view:"plan",            // plan | outlet
  outlet:null, stage:"pre",
  brief:null, briefLoading:false, briefError:null, briefSample:false,
  checks:{}, appId:null,
  objId:null, objText:null, objLoading:false, objSample:false,
  post:{ status:"", outcome:"", steps:[], notes:"" }, saving:false
};
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function render(){
  if(state.view==="plan") renderPlan();
  else renderOutlet();
  window.scrollTo(0,0);
}

/* ---------------- SCREEN: CALL PLAN ---------------------------------- */
async function renderPlan(){
  app.innerHTML = `<div class="stack">
    <div>
      <h1 style="font-size:26px;margin:6px 0 2px">Today's calls</h1>
      <div class="muted" id="plan-sub">Wednesday 12 August · loading…</div>
    </div>
    <div id="plan-list" class="card muted" style="font-size:14px">Loading call plan…</div>
  </div>`;
  const outlets = await dataService.getCallPlan();
  document.getElementById("plan-sub").textContent =
    `Wednesday 12 August · ${outlets.length} outlets planned`;
  const list = document.getElementById("plan-list");
  list.outerHTML = `<div id="plan-list" style="display:flex;flex-direction:column;gap:10px">` +
    outlets.map(o=>{
      const pb = PLAYBOOK[o.reasonCode];
      const foot = o.lastVisitStatus
        ? `<span style="color:var(--green);font-weight:600">✓ Visited today — ${esc(o.lastVisitStatus)}</span>`
        : esc(pb.label);
      return `<button class="card outlet-card" data-id="${o.id}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
          <div>
            <div style="font-weight:700;font-size:15.5px;line-height:1.3">${esc(o.name)}</div>
            <div class="small" style="margin-top:3px">${esc(o.channel)} · ${esc(o.area)}</div>
          </div>
          <span class="chip ${pb.tone}">${pb.short}</span>
        </div>
        <div class="small" style="margin-top:10px;border-top:1px solid var(--line);padding-top:9px">${foot}</div>
      </button>`;
    }).join("") +
    `</div>
    <div style="text-align:center;margin-top:10px">
      <span class="chip neutral">Data source: demo — integration-ready</span>
    </div>`;
  document.querySelectorAll(".outlet-card").forEach(b=>{
    b.onclick = async ()=>{
      state.outlet = await dataService.getOutlet(b.dataset.id);
      state.view="outlet"; state.stage="pre";
      state.brief=null; state.briefError=null; state.briefSample=false;
      state.checks={}; state.appId = state.outlet.application;
      state.objId=null; state.objText=null; state.objLoading=false; state.objSample=false;
      state.post={status:"",outcome:"",steps:[],notes:""};
      render();
    };
  });
}

/* ---------------- SCREEN: OUTLET FLOW -------------------------------- */
function renderOutlet(){
  const o = state.outlet, pb = PLAYBOOK[o.reasonCode];
  const stages = [["pre","Pre-call"],["in","In-call"],["post","Post-call"]];
  const idx = stages.findIndex(s=>s[0]===state.stage);
  const railColor = pb.tone==="amber" ? "var(--amber)" : "var(--blue)";

  app.innerHTML = `
    <div style="padding:0 20px 12px">
      <button class="backlink" id="back">← Call plan</button>
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-top:8px">
        <div>
          <h1 style="font-size:21px;line-height:1.25">${esc(o.name)}</h1>
          <div class="small" style="margin-top:3px">${esc(o.channel)} · ${esc(o.area)}</div>
        </div>
        <span class="chip ${pb.tone}" style="white-space:nowrap;margin-top:3px">${pb.short}</span>
      </div>
    </div>
    <div class="rail">${stages.map((s,i)=>`
      <button data-stage="${s[0]}" data-active="${i===idx?1:0}" ${i===idx?'aria-current="step"':''}>
        <div class="bar" style="${i<=idx?`background:${railColor};`:""}${i<idx?"opacity:.45":""}"></div>
        <div class="name">${s[1]}</div>
      </button>`).join("")}
    </div>
    <div class="stack" id="stage-body"></div>`;

  document.getElementById("back").onclick = ()=>{ state.view="plan"; render(); };
  document.querySelectorAll(".rail button").forEach(b=>{
    b.onclick = ()=>{ state.stage=b.dataset.stage; render(); };
  });

  const body = document.getElementById("stage-body");
  if(state.stage==="pre") renderPre(body,o,pb);
  else if(state.stage==="in") renderIn(body,o,pb);
  else renderPost(body,o,pb);
}

/* ---------------- STAGE: PRE-CALL ------------------------------------ */
function renderPre(body,o,pb){
  const q = pb.tone;
  const historyRows = o.history.slice(0,4).map(h=>`
    <div style="display:flex;gap:10px;font-size:13px;line-height:1.45">
      <div style="color:var(--ink-soft);min-width:74px;font-variant-numeric:tabular-nums">${h.date.slice(5)}</div>
      <div><b style="color:${h.type==="order"?"var(--green)":(q==="amber"?"var(--amber)":"var(--blue)")}">${h.type==="order"?"Order":"Visit"}</b> — ${esc(h.summary)}</div>
    </div>`).join("");

  let briefHTML = "";
  if(state.brief){
    const b = state.brief;
    briefHTML = `<div class="card" style="border-color:${q==="amber"?"var(--amber)":"var(--blue)"};border-width:1.5px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="label" style="color:${q==="amber"?"var(--amber)":"var(--blue)"}">✦ AI pre-call brief</div>
        <button class="backlink" id="regen" style="font-size:12px">${state.briefLoading?"…":"Regenerate"}</button>
      </div>
      ${state.briefSample?`<div class="notice" style="margin-top:10px">AI service not reachable here — showing a sample brief. Inside a Claude artifact (or once wired to a backend), this is generated live from the account data.</div>`:""}
      <div style="margin-top:12px;display:flex;flex-direction:column;gap:14px;font-size:14px;line-height:1.55">
        <div><div class="label" style="margin-bottom:4px">Objective</div><div style="font-weight:600">${esc(b.objective)}</div></div>
        <div><div class="label" style="margin-bottom:4px">Where this account stands</div><div>${esc(b.situation)}</div></div>
        <div><div class="label" style="margin-bottom:4px">Opening line</div><div class="quote ${q}">“${esc(b.openingLine)}”</div></div>
        <div><div class="label" style="margin-bottom:4px">Key questions</div>
          ${b.keyQuestions.map(x=>`<div class="bullet"><b style="color:${q==="amber"?"var(--amber)":"var(--blue)"}">·</b><span>${esc(x)}</span></div>`).join("")}</div>
        <div><div class="label" style="margin-bottom:4px">Pitch angle</div><div>${esc(b.pitchAngle)}</div></div>
        <div><div class="label" style="margin-bottom:4px">Watch out for</div>
          ${b.watchouts.map(x=>`<div class="bullet"><b style="color:var(--amber)">!</b><span>${esc(x)}</span></div>`).join("")}</div>
        <div><div class="label" style="margin-bottom:4px">Ask for before leaving</div>
          <div style="font-weight:600;color:var(--green)">${esc(b.suggestedGoal)}</div></div>
      </div>
    </div>`;
  }

  body.innerHTML = `
    <div class="card">
      <div class="label">Account snapshot</div>
      <div style="font-size:14px;line-height:1.55;margin-top:8px">${esc(o.profile)}</div>
      <div class="muted" style="margin-top:8px">Contact: ${esc(o.contact)}</div>
    </div>
    <div class="card">
      <div class="label">Recent history</div>
      <div style="margin-top:10px;display:flex;flex-direction:column;gap:8px">${historyRows}</div>
    </div>
    ${state.brief ? "" : `<button class="btn tone-${q}" id="gen" ${state.briefLoading?"disabled":""}>
      ${state.briefLoading?"Preparing your brief…":"✦ Generate AI pre-call brief"}</button>`}
    ${state.briefError?`<div style="font-size:13px;color:var(--red)">${esc(state.briefError)}</div>`:""}
    ${briefHTML}
    <button class="btn" id="next">Start the call →</button>`;

  const run = async ()=>{
    state.briefLoading = true; state.briefError = null; render();
    try {
      state.brief = await generateBrief(o,pb); state.briefSample = false;
    } catch(e){
      state.brief = SAMPLE_BRIEFS[pb.id]; state.briefSample = true;
    }
    state.briefLoading = false; render();
  };
  const gen = document.getElementById("gen"); if(gen) gen.onclick = run;
  const regen = document.getElementById("regen"); if(regen) regen.onclick = run;
  document.getElementById("next").onclick = ()=>{ state.stage="in"; render(); };
}

/* ---------------- STAGE: IN-CALL ------------------------------------- */
function renderIn(body,o,pb){
  const q = pb.tone;
  const done = Object.values(state.checks).filter(Boolean).length;

  let pitchHTML = "";
  if(pb.pitchLines){
    pitchHTML = `<div class="card">
      <div class="label">Conversation openers</div>
      <div style="margin-top:10px;display:flex;flex-direction:column;gap:8px">
        ${pb.pitchLines.map(p=>`<div class="quote ${q}">“${esc(p)}”</div>`).join("")}
      </div></div>`;
  }
  if(pb.applications){
    const active = pb.applications.find(a=>a.id===state.appId);
    pitchHTML += `<div class="card">
      <div class="label">Pitch by application</div>
      <div class="row" style="margin-top:10px">
        ${pb.applications.map(a=>`
          <button class="pill ${q}" data-on="${state.appId===a.id?1:0}" data-app="${a.id}"
            ${a.available?"":"disabled"}>${esc(a.label)}${a.available?"":" · soon"}</button>`).join("")}
      </div>
      ${active && active.pitch ? `
        <div style="margin-top:14px">
          <div style="font-family:'Sora',sans-serif;font-weight:700;font-size:16px">${esc(active.pitch.product)}</div>
          <div style="margin-top:8px;display:flex;flex-direction:column;gap:5px">
            ${active.pitch.points.map(pt=>`<div class="bullet"><b style="color:${q==="amber"?"var(--amber)":"var(--blue)"}">·</b><span>${esc(pt)}</span></div>`).join("")}
          </div>
        </div>` : ""}
    </div>`;
  }

  const lib = OBJECTION_LIBRARY[pb.id] || [];
  const activeObj = lib.find(x=>x.id===state.objId);
  let objHTML = "";
  if(lib.length){
    objHTML = `<div class="card">
      <div class="label">Objection handling</div>
      <div class="small" style="margin-top:4px">Tap what the customer said</div>
      <div class="row" style="margin-top:10px">
        ${lib.map(x=>`<button class="pill ${q}" data-on="${state.objId===x.id?1:0}" data-obj="${x.id}">${esc(x.label)}</button>`).join("")}
      </div>
      ${activeObj?`
        <div style="margin-top:14px">
          <div class="label" style="margin-bottom:4px">Approved response</div>
          <div style="font-size:14px;line-height:1.55">${esc(activeObj.approved)}</div>
        </div>
        ${state.objText?`
          <div style="margin-top:12px">
            <div class="label" style="margin-bottom:6px;color:${q==="amber"?"var(--amber)":"var(--blue)"}">✦ Tailored for ${esc(o.name)}</div>
            ${state.objSample?`<div class="notice" style="margin-bottom:8px">AI service not reachable here — showing the approved response as-is. Runs live inside a Claude artifact or once wired to a backend.</div>`:""}
            <div class="quote ${q}">“${esc(state.objText)}”</div>
          </div>`
        :`<button class="btn tone-${q}" id="tailor" style="margin-top:12px" ${state.objLoading?"disabled":""}>
            ${state.objLoading?"Tailoring…":"✦ Tailor for this account"}</button>`}
      `:""}
    </div>`;
  }

  body.innerHTML = `
    <div class="card">
      <div class="label">Call plan — ${esc(pb.label)}</div>
      <div class="row" style="margin-top:8px">
        ${pb.actions.map((a,i)=>`<span class="chip ${q}">${i+1}. ${esc(a)}</span>`).join("")}
      </div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <div class="label">Discovery checklist</div>
        <span class="small" style="font-variant-numeric:tabular-nums">${done}/${pb.checks.length}</span>
      </div>
      <div style="margin-top:10px;display:flex;flex-direction:column;gap:4px">
        ${pb.checks.map((c,i)=>`
          <label class="checkrow ${state.checks[i]?"done":""}">
            <input type="checkbox" data-check="${i}" ${state.checks[i]?"checked":""}>
            <span>${esc(c)}</span>
          </label>`).join("")}
      </div>
    </div>
    ${pitchHTML}
    ${objHTML}
    <button class="btn" id="next">Wrap up — log the visit →</button>`;

  body.querySelectorAll("input[data-check]").forEach(cb=>{
    cb.onchange = ()=>{ state.checks[cb.dataset.check] = cb.checked; render(); };
  });
  body.querySelectorAll("button[data-app]").forEach(b=>{
    b.onclick = ()=>{ state.appId = b.dataset.app; render(); };
  });
  body.querySelectorAll("button[data-obj]").forEach(b=>{
    b.onclick = ()=>{
      state.objId = b.dataset.obj===state.objId ? null : b.dataset.obj;
      state.objText=null; state.objSample=false; render();
    };
  });
  const tailorBtn = document.getElementById("tailor");
  if(tailorBtn) tailorBtn.onclick = async ()=>{
    const obj = lib.find(x=>x.id===state.objId); if(!obj || state.objLoading) return;
    state.objLoading = true; render();
    try { state.objText = await tailorObjection(o, pb, obj); state.objSample = false; }
    catch(e){ state.objText = obj.approved; state.objSample = true; }
    state.objLoading = false; render();
  };
  document.getElementById("next").onclick = ()=>{ state.stage="post"; render(); };
}

/* ---------------- STAGE: POST-CALL ----------------------------------- */
function renderPost(body,o,pb){
  const q = pb.tone, p = state.post;
  body.innerHTML = `
    <div class="card">
      <div class="label">Visit status</div>
      <select id="f-status" style="margin-top:8px">
        <option value="">Select status…</option>
        ${pb.statuses.map(s=>`<option ${p.status===s?"selected":""}>${esc(s)}</option>`).join("")}
      </select>
    </div>
    <div class="card">
      <div class="label">${esc(pb.outcomeLabel)}</div>
      <select id="f-outcome" style="margin-top:8px">
        <option value="">Select…</option>
        ${pb.outcomes.map(s=>`<option ${p.outcome===s?"selected":""}>${esc(s)}</option>`).join("")}
      </select>
    </div>
    <div class="card">
      <div class="label">Next steps</div>
      ${pb.nextSteps.length ? `<div class="row" style="margin-top:10px">
          ${pb.nextSteps.map(s=>`<button class="pill ${q}" data-on="${p.steps.includes(s)?1:0}" data-step="${esc(s)}">
            ${p.steps.includes(s)?"✓ ":""}${esc(s)}</button>`).join("")}
        </div>`
        : `<div class="muted" style="margin-top:8px">Describe agreed follow-up in the notes below.</div>`}
    </div>
    <div class="card">
      <div class="label">Notes</div>
      <textarea id="f-notes" style="margin-top:8px" placeholder="What was said, agreed, or promised…">${esc(p.notes)}</textarea>
      <div class="small" style="margin-top:8px">Saved notes feed the next visit's AI brief for this outlet.</div>
    </div>
    <button class="btn" id="save" ${p.status?"":"disabled"}>${state.saving?"Saving…":"Save visit"}</button>`;

  document.getElementById("f-status").onchange = e=>{ p.status = e.target.value; render(); };
  document.getElementById("f-outcome").onchange = e=>{ p.outcome = e.target.value; };
  document.getElementById("f-notes").oninput = e=>{ p.notes = e.target.value;
    document.getElementById("save").disabled = !p.status; };
  body.querySelectorAll("button[data-step]").forEach(b=>{
    b.onclick = ()=>{
      const s = b.dataset.step;
      p.steps = p.steps.includes(s) ? p.steps.filter(x=>x!==s) : [...p.steps, s];
      render();
    };
  });
  document.getElementById("save").onclick = async ()=>{
    if(!p.status || state.saving) return;
    state.saving = true; render();
    await dataService.saveVisit({
      outletId:o.id, date:"2026-08-12", reasonCode:pb.id,
      status:p.status, outcome:p.outcome, nextSteps:p.steps, notes:p.notes.trim()
    });
    state.saving = false; state.view = "plan"; render();
  };
}

render();
</script>
</body>
</html>
